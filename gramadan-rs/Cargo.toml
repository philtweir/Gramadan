[package]
name = "gramadan"
version = "0.1.0"
edition = "2021"
description = "Irish language morphology engine — declension, conjugation, and mutation operations"
license = "MIT"

[lib]
name = "gramadan"
# rlib for Rust consumers (Gréasán builder_plugin, later); cdylib for the PyO3
# extension module (maturin builds this into `gramadan_rs`).
crate-type = ["rlib", "cdylib"]

[dependencies]
regex = "1"
once_cell = "1"
quick-xml = "0.37"
# Optional: only pulled for the Python extension build (maturin enables the
# `python` feature via pyproject). Rust-lib consumers never see pyo3.
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[features]
python = ["dep:pyo3"]

[[bin]]
name = "cross-validate"
path = "src/bin/cross_validate.rs"
